name: Deploy to production

on:
  push:
    branches: [dev]

# GHCR отдаёт крупные слои со скоростью около нуля, и деплой вставал по таймауту,
# хотя канал сервера — 40 МБ/с. Docker Hub с той же машины качает 300 МБ за 2 секунды.
env:
  IMAGE_OWNER: luckx16

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: ${{ env.IMAGE_OWNER }}/ai-wardrobe-server:latest

      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: ${{ env.IMAGE_OWNER }}/ai-wardrobe-client:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Дефолт у экшена — 10 минут, и на них деплой уже падал.
          # Образ сервера весит 3 ГБ, запас нужен.
          command_timeout: 20m
          script: |
            set -e
            cd /var/www/ai-wardrobe
            git fetch origin dev
            git reset --hard origin/dev
            docker compose pull server client
            docker compose up -d db server client
            docker image prune -f

            # nginx-конфиг раскладывается из репозитория, а не правится на сервере:
            # разошедшийся с git конфиг прокси уже ронял HTTPS, причём молча —
            # до ближайшей перезагрузки хоста всё выглядело рабочим.
            # Если новый конфиг не проходит проверку, откатываем файл: иначе битая
            # версия осталась бы на диске и убила бы nginx (вместе с соседним сайтом)
            # при первом же reload или ребуте.
            cp /etc/nginx/sites-available/ai-wardrobe /tmp/vhost.bak
            install -m 644 deploy/nginx/ai-wardrobe.conf /etc/nginx/sites-available/ai-wardrobe
            if nginx -t; then
              systemctl reload nginx
            else
              cp /tmp/vhost.bak /etc/nginx/sites-available/ai-wardrobe
              echo "nginx -t не прошёл, конфиг откачен" >&2
              exit 1
            fi
