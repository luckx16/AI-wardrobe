## Nginx vhost для ai-wardrobe.ru
##
## Эталонная копия. Рабочий файл лежит на сервере в
## /etc/nginx/sites-available/ai-wardrobe (обычный файл, НЕ симлинк на репозиторий —
## иначе `git reset --hard` в CI/CD снёс бы блоки, которые дописывает certbot).
## При любой правке здесь — вручную синхронизировать с сервером и наоборот.
##
## Оба приложения живут на одной машине:
##   другое веб-приложение     -> статика Vite + /api -> pm2 (порт 3000)
##   ai-wardrobe.ru  -> этот конфиг         -> docker compose (порты 3001 и 4000)
##
## HTTPS-блоки (listen 443, ssl_certificate, редирект с 80) дописывает
## `certbot --nginx -d ai-wardrobe.ru -d www.ai-wardrobe.ru`.

server {
    server_name ai-wardrobe.ru www.ai-wardrobe.ru;

    # Multer принимает файлы до 10 МБ, express.json — до 15 МБ (base64-картинки).
    # Дефолтный лимит nginx (1 МБ) рубил бы загрузку вещей с 413.
    client_max_body_size 15m;

    # API. Генерация образа ходит во внешние LLM и может занимать больше минуты,
    # поэтому таймаут заметно выше дефолтных 60s.
    location /api {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Загруженные пользователями изображения раздаёт Express из своего volume.
    location /uploads {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket AI-чата (ws/chatWs.js, путь /ws/chat?token=...).
    location /ws {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Соединение чата держится открытым между сообщениями.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Всё остальное — Next.js в standalone-режиме (не статика, нужен прокси).
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ai-wardrobe.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ai-wardrobe.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.ai-wardrobe.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = ai-wardrobe.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name ai-wardrobe.ru www.ai-wardrobe.ru;
    return 404; # managed by Certbot




}