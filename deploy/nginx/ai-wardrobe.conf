## Nginx vhost для ai-wardrobe.ru
##
## Источник правды — этот файл: деплой раскладывает его на сервер
## (/etc/nginx/sites-available/ai-wardrobe), проверяет `nginx -t` и перезагружает
## nginx, а при неудачной проверке откатывает. Поэтому правки вносить здесь.
##
## Единственное исключение — certbot: он дописывает HTTPS-блоки прямо на сервере.
## После его запуска скопировать файл обратно сюда и закоммитить, иначе следующий
## деплой вернёт версию без TLS.
##
## Приложение живёт в docker compose: клиент на 127.0.0.1:3001, сервер на :4000.
## Клиент именно на 3001, а не на 3000: на этот же сервер переезжает второе
## веб-приложение, у которого бэкенд слушает 3000. Оно встанет рядом отдельным
## vhost'ом, поэтому порты разведены заранее.

server {
    server_name ai-wardrobe.ru www.ai-wardrobe.ru;

    # Multer принимает файлы до 10 МБ, express.json — до 15 МБ (base64-картинки).
    # Дефолтный лимит nginx (1 МБ) рубил бы загрузку вещей с 413.
    client_max_body_size 15m;

    # API. Генерация образа ходит во внешние LLM и может занимать больше минуты,
    # поэтому таймаут заметно выше дефолтных 60s.
    location /api {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Загруженные пользователями изображения раздаёт Express из своего volume.
    location /uploads {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket AI-чата (ws/chatWs.js, путь /ws/chat?token=...).
    location /ws {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Соединение чата держится открытым между сообщениями.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Всё остальное — Next.js в standalone-режиме (не статика, нужен прокси).
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ai-wardrobe.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ai-wardrobe.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.ai-wardrobe.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = ai-wardrobe.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name ai-wardrobe.ru www.ai-wardrobe.ru;
    return 404; # managed by Certbot




}
